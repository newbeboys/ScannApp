name: Build Signed AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        # WAJIB: src/lib/supabase.ts throw di top-level module kalau kosong,
        # dan tidak ada error boundary di main.tsx — tanpa ini AAB terbuild
        # sempurna dan lolos signing, tapi layar putih kosong untuk semua
        # user begitu terpasang dari Play Store.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTOREBASE64 }}" | base64 -d > android/app/scannapp.jks

      - name: Build signed AAB
        working-directory: android
        run: |
          ./gradlew bundleRelease \
            -PSCANNAPP_KEYSTORE_PATH=scannapp.jks \
            -PSCANNAPP_KEYSTORE_PASSWORD=${{ secrets.KEYSTOREPASSWORD }} \
            -PSCANNAPP_KEY_ALIAS=${{ secrets.KEYALIAS }} \
            -PSCANNAPP_KEY_PASSWORD=${{ secrets.KEYPASSWORD }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab