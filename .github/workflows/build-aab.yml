name: Build Signed AAB & APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        # WAJIB: src/lib/supabase.ts throw di top-level module kalau kosong,
        # dan tidak ada error boundary di main.tsx — tanpa ini AAB terbuild
        # sempurna dan lolos signing, tapi layar putih kosong untuk semua
        # user begitu terpasang dari Play Store.
        #
        # Tiga VITE_ADMOB_* di bawah hanya ada di workflow ini, sengaja TIDAK
        # di ci.yml: APK debug dipasang berulang kali di HP Boss Ali sendiri,
        # dan impresi iklan asli dari HP developer itu invalid traffic yang
        # bisa membuat akun AdMob ditutup. APK debug tetap pakai unit test.
        # Kalau ketiga secret ini belum di-set, aplikasi rilis TIDAK crash —
        # ia jatuh ke unit test, artinya iklannya tampil tapi tidak menghasilkan
        # apa-apa. Jadi kalau pendapatan nol setelah rilis, cek ini dulu.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ADMOB_BANNER_UNIT_ID: ${{ secrets.VITE_ADMOB_BANNER_UNIT_ID }}
          VITE_ADMOB_INTERSTITIAL_UNIT_ID: ${{ secrets.VITE_ADMOB_INTERSTITIAL_UNIT_ID }}
          VITE_ADMOB_APP_OPEN_UNIT_ID: ${{ secrets.VITE_ADMOB_APP_OPEN_UNIT_ID }}
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTOREBASE64 }}" | base64 -d > android/app/scannapp.jks

      - name: Build signed AAB + APK
        # bundleRelease (AAB, untuk Play Console) dan assembleRelease (APK,
        # untuk dites langsung di HP) dijalankan dalam SATU invocation Gradle
        # yang sama, dari buildType `release` yang sama persis di
        # android/app/build.gradle -- signing config, kode web hasil `npm run
        # build` di atas (dengan VITE_ADMOB_* asli), dan proguard rules semua
        # identik untuk keduanya. Ini yang menjamin APK yang dites di HP dan
        # AAB yang naik ke Play Console tidak pernah berbeda isi -- bukan dua
        # build terpisah yang kebetulan dari commit yang sama, tapi literally
        # satu kompilasi yang dikemas dua format.
        working-directory: android
        run: |
          ./gradlew bundleRelease assembleRelease \
            -PSCANNAPP_KEYSTORE_PATH=scannapp.jks \
            -PSCANNAPP_KEYSTORE_PASSWORD=${{ secrets.KEYSTOREPASSWORD }} \
            -PSCANNAPP_KEY_ALIAS=${{ secrets.KEYALIAS }} \
            -PSCANNAPP_KEY_PASSWORD=${{ secrets.KEYPASSWORD }}

      - name: Upload AAB artifact
        # Ini yang diunggah ke Google Play Console.
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload APK artifact
        # Ini yang didownload untuk dites langsung di HP -- signed dengan
        # keystore rilis yang sama (bukan debug keystore), jadi kalau pernah
        # menginstal APK debug dari workflow CI di HP yang sama, copot dulu:
        # keystore beda berarti signature beda, dan Android menolak
        # menimpa APK lama dengan yang signature-nya tidak cocok.
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error