name: CI

on:
  push:
    # Feature branches ikut dibuild supaya APK-nya bisa diuji Boss Ali
    # sebelum digabung ke main (mesin dev tidak punya Android SDK).
    # `fix/**` ikut sejak 23 Agustus 2026: perbaikan pun perlu diuji di HP,
    # dan tanpa pola ini push-nya lewat tanpa menghasilkan APK sama sekali.
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Suite "browser" menjalankan imageEditor & komponen React di Chromium
      # sungguhan — canvas dan encoder JPEG/PNG-nya tidak bisa dipalsukan.
      # Tanpa langkah ini `npm test` gagal di runner yang belum punya browser.
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        # VITE_* WAJIB ada di sini juga (bukan cuma di step build di bawah):
        # ReferralScreen.browser.test.tsx meng-import ReferralScreen.tsx, yang
        # meng-import referralApi.ts, yang meng-import supabase.ts -- dan
        # src/lib/supabase.ts throw di top-level module kalau kosong (lihat
        # komentar di step "Typecheck & build"). Nilainya anon key + URL
        # publik yang sudah ikut terkirim di dalam APK ke semua user, jadi
        # bukan credential rahasia (beda dari R2/service-role secret) --
        # bukan pelanggaran Aturan Keras #1.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm test

      - name: Typecheck & build
        # VITE_* di sini WAJIB ada: src/lib/supabase.ts throw di top-level
        # module kalau kosong, dan tidak ada error boundary di main.tsx — jadi
        # tanpa secret ini APK-nya "berhasil" dibuild tapi layar putih kosong
        # di device (JS gagal mount sebelum sempat render apa pun).
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        # Sama seperti job "web" di atas — tanpa ini APK terbuild sempurna
        # tapi layar putih kosong di device fisik (lihat komentar job web).
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java 21 Temurin
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: scannapp-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
