apply plugin: 'com.android.application'

android {
    namespace = "com.newbeboys.scannapp"
    compileSdk = rootProject.ext.compileSdkVersion
    // AGP 8+ stopped generating BuildConfig by default. DebugBuildPlugin.java
    // (Fase 8.5b) reads BuildConfig.DEBUG to tell a debug Gradle build from
    // a release one -- without this flag the class does not exist at all,
    // not just an empty one, and compileDebugJavaWithJavac fails outright.
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.newbeboys.scannapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode = angka yang dipakai Google Play untuk mendeteksi versi baru.
        // WAJIB dinaikkan setiap upload AAB baru ke Play Console, tidak boleh mundur/sama.
        // versionName = string yang dilihat user di halaman Play Store.
        versionCode 11
        versionName "2.4.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // Signing config untuk release dibaca dari ~/.gradle/gradle.properties (di luar repo,
    // tidak pernah masuk git). 4 properti berikut sudah diisi Boss Ali di sana:
    //   SCANNAPP_KEYSTORE_PATH=/path/absolut/ke/keystore.jks
    //   SCANNAPP_KEYSTORE_PASSWORD=...
    //   SCANNAPP_KEY_ALIAS=...
    //   SCANNAPP_KEY_PASSWORD=...
    // Kalau properti belum/tidak lengkap, build debug tetap jalan normal — hanya release
    // yang gagal ditandatangani (lihat signingConfig di bawah).
    def releaseKeystorePath = project.findProperty('SCANNAPP_KEYSTORE_PATH')
    def releaseKeystorePassword = project.findProperty('SCANNAPP_KEYSTORE_PASSWORD')
    def releaseKeyAlias = project.findProperty('SCANNAPP_KEY_ALIAS')
    def releaseKeyPassword = project.findProperty('SCANNAPP_KEY_PASSWORD')
    def hasReleaseSigningProps = releaseKeystorePath && releaseKeystorePassword &&
            releaseKeyAlias && releaseKeyPassword

    signingConfigs {
        release {
            if (hasReleaseSigningProps) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigningProps) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("SCANNAPP_KEYSTORE_PATH/SCANNAPP_KEYSTORE_PASSWORD/SCANNAPP_KEY_ALIAS/SCANNAPP_KEY_PASSWORD belum lengkap di ~/.gradle/gradle.properties — build release TIDAK akan ditandatangani.")
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// @capacitor-mlkit/text-recognition menarik kelima model skrip sekaligus.
// Diukur dari Maven Google (16.0.1): Latin 1,38 MB, Mandarin 2,04 MB,
// Devanagari 2,02 MB, Jepang 2,63 MB, Korea 1,90 MB — jadi ±8,6 MB masuk APK
// untuk skrip yang tidak akan pernah dipakai aplikasi berbahasa Indonesia.
//
// Aman dibuang karena src/lib/ocr.ts memaku Script.Latin, dan pemilihnya di
// plugin cuma switch biasa (createRecognizerOptionsForScript): cabang yang
// tidak pernah dieksekusi tidak pernah memuat kelasnya. Kalau suatu hari OCR
// non-Latin benar-benar dibutuhkan, hapus baris skrip itu di sini.
configurations.configureEach {
    exclude group: 'com.google.mlkit', module: 'text-recognition-chinese'
    exclude group: 'com.google.mlkit', module: 'text-recognition-devanagari'
    exclude group: 'com.google.mlkit', module: 'text-recognition-japanese'
    exclude group: 'com.google.mlkit', module: 'text-recognition-korean'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Fase 8.5b — google-services.json memang di-commit ke repo (lihat catatan
// panjang di TASKS.md/CLAUDE.md): Google sendiri menyatakan file ini tidak
// perlu dirahasiakan untuk app Android, karena ia sudah ikut terbundel di
// dalam APK yang dikirim ke semua user dan bisa diekstrak dari situ kapan
// saja -- sama seperti App ID AdMob yang sudah lebih dulu ditulis di
// AndroidManifest.xml. try/catch di bawah sebelumnya cuma menjaga
// google-services plugin, sekarang Crashlytics plugin ikut di dalamnya
// karena keduanya sama-sama butuh berkas yang sama dan sama-sama tidak ada
// gunanya diterapkan tanpanya.
try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        apply plugin: 'com.google.firebase.crashlytics'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services/crashlytics plugin not applied.")
}