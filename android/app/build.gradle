apply plugin: 'com.android.application'

android {
    namespace = "com.newbeboys.scannapp"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.newbeboys.scannapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode = angka yang dipakai Google Play untuk mendeteksi versi baru.
        // WAJIB dinaikkan setiap upload AAB baru ke Play Console, tidak boleh mundur/sama.
        // versionName = string yang dilihat user di halaman Play Store.
        versionCode 9
        versionName "2.3.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // Signing config untuk release dibaca dari ~/.gradle/gradle.properties (di luar repo,
    // tidak pernah masuk git). 4 properti berikut sudah diisi Boss Ali di sana:
    //   SCANNAPP_KEYSTORE_PATH=/path/absolut/ke/keystore.jks
    //   SCANNAPP_KEYSTORE_PASSWORD=...
    //   SCANNAPP_KEY_ALIAS=...
    //   SCANNAPP_KEY_PASSWORD=...
    // Kalau properti belum/tidak lengkap, build debug tetap jalan normal — hanya release
    // yang gagal ditandatangani (lihat signingConfig di bawah).
    def releaseKeystorePath = project.findProperty('SCANNAPP_KEYSTORE_PATH')
    def releaseKeystorePassword = project.findProperty('SCANNAPP_KEYSTORE_PASSWORD')
    def releaseKeyAlias = project.findProperty('SCANNAPP_KEY_ALIAS')
    def releaseKeyPassword = project.findProperty('SCANNAPP_KEY_PASSWORD')
    def hasReleaseSigningProps = releaseKeystorePath && releaseKeystorePassword &&
            releaseKeyAlias && releaseKeyPassword

    signingConfigs {
        release {
            if (hasReleaseSigningProps) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigningProps) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("SCANNAPP_KEYSTORE_PATH/SCANNAPP_KEYSTORE_PASSWORD/SCANNAPP_KEY_ALIAS/SCANNAPP_KEY_PASSWORD belum lengkap di ~/.gradle/gradle.properties — build release TIDAK akan ditandatangani.")
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}