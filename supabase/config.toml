# Konfigurasi Edge Function.
#
# Default Supabase adalah verify_jwt = true: gateway menolak request tanpa JWT
# Supabase yang sah sebelum kode fungsi sempat jalan. Itu benar untuk empat
# fungsi Fase 4 yang dipanggil user dari aplikasi, tapi salah untuk webhook.

[functions.generate-upload-url]
verify_jwt = true

[functions.confirm-upload]
verify_jwt = true

[functions.generate-download-url]
verify_jwt = true

[functions.delete-backup]
verify_jwt = true

[functions.admin-set-r2-cors]
verify_jwt = true

# Pemanggilnya server RevenueCat, bukan user — tidak ada JWT Supabase yang bisa
# dikirim. Kalau verify_jwt dibiarkan true, SEMUA webhook ditolak 401 di
# gateway dan tidak ada pembelian yang pernah mengaktifkan Pro.
#
# Ini BUKAN berarti endpoint-nya terbuka: fungsi ini memverifikasi signature
# HMAC-SHA256 RevenueCat sendiri (header X-RevenueCat-Webhook-Signature,
# lihat _shared/webhookSignature.ts — terikat ke isi body & timestamp,
# toleransi 5 menit untuk menahan replay), dan menolak 503 kalau
# REVENUECAT_WEBHOOK_SECRET (signing secret-nya) belum di-set.
[functions.revenuecat-webhook]
verify_jwt = false

# Pemanggilnya pg_cron lewat pg_net, bukan user — tidak ada JWT Supabase yang
# bisa dikirim. Endpoint ini menolak sendiri (401) request yang header
# x-cron-secret-nya tidak cocok dengan CRON_SECRET (lihat
# _shared/orphanCleanup.ts verifyCronSecret dan migration cron-nya).
[functions.cleanup-orphan-r2]
verify_jwt = false
