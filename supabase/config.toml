# Konfigurasi Edge Function.
#
# Default Supabase adalah verify_jwt = true: gateway menolak request tanpa JWT
# Supabase yang sah sebelum kode fungsi sempat jalan. Itu benar untuk empat
# fungsi Fase 4 yang dipanggil user dari aplikasi, tapi salah untuk webhook.

[functions.generate-upload-url]
verify_jwt = true

[functions.confirm-upload]
verify_jwt = true

[functions.generate-download-url]
verify_jwt = true

[functions.delete-backup]
verify_jwt = true

[functions.admin-set-r2-cors]
verify_jwt = true

# Pemanggilnya server RevenueCat, bukan user — tidak ada JWT Supabase yang bisa
# dikirim. Kalau verify_jwt dibiarkan true, SEMUA webhook ditolak 401 di
# gateway dan tidak ada pembelian yang pernah mengaktifkan Pro.
#
# Ini BUKAN berarti endpoint-nya terbuka: fungsi ini memverifikasi shared
# secret REVENUECAT_WEBHOOK_SECRET sendiri, dengan perbandingan konstan-waktu,
# dan menolak 503 kalau secret itu belum di-set.
[functions.revenuecat-webhook]
verify_jwt = false
